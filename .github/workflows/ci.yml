name: ORBITA-30 CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
      - name: Use supported Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Secret and source hygiene scan
        run: npm run security:scan
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit and contract tests
        run: npm test
      - name: Coverage gates
        run: npm run test:coverage
      - name: Migration consistency
        run: npm run db:check
      - name: Production build
        run: npm run build
      - name: Install browser for CSP regression
        run: npx playwright install --with-deps chromium
      - name: Browser hydration and CSP regression
        run: npm run test:browser
      - name: Install PDF visual regression dependency
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y poppler-utils
      - name: PDF visual fixtures
        env:
          ORBITA_PDF_FIXTURE_DIR: tmp/pdfs/fixtures
        run: npm run test:pdf-visual
      - name: Local Worker/D1/R2 negative smoke
        run: npm run test:e2e
      - name: Retention index query plan
        run: npm run test:retention-plan
      - name: Concurrent load and idempotency smoke
        run: npm run test:load
      - name: Backup and restore smoke
        run: npm run test:backup
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Verify release manifest and reproducible package
        run: npm run release:verify
      - name: Verify clean checkout
        run: test -z "$(git status --porcelain)"
