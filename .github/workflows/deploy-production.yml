name: Deploy production beta

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: orbita-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
    steps:
      - uses: actions/checkout@v4
      - name: Require successful CI for this SHA
        run: |
          echo "Production source SHA: $GITHUB_SHA"
          test "$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')" -gt 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Validate isolated bindings and beta flags
        run: npm run deploy:config-check
      - name: Apply production migrations
        run: npx wrangler d1 migrations apply DB --config wrangler.jsonc --remote --env production
      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.jsonc --env production | tee production-deploy.log
      - name: Access-protected production smoke
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID_PRODUCTION }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET_PRODUCTION }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: node scripts/hosted-smoke.mjs production
      - name: Save production evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbita-production-${{ github.sha }}
          path: |
            production-deploy.log
            hosted-smoke-production.json
